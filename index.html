<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật Ký Bảo Dưỡng - ODO</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #495057; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        input:focus, select:focus, textarea:focus { border-color: #80bdff; outline: none; box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25); }
        .radio-group { display: flex; gap: 20px; padding: 10px 0; }
        .radio-group label { font-weight: normal; display: flex; align-items: center; cursor: pointer; }
        .radio-group input { width: auto; margin-right: 8px; cursor: pointer; }
        
        button { width: 100%; padding: 14px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        
        #status { text-align: center; margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 6px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .loading { background-color: #e2e3e5; color: #383d41; }
        
        .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .tag { background: #e9ecef; padding: 5px 12px; border-radius: 15px; font-size: 13px; cursor: pointer; transition: background 0.2s; }
        .tag:hover { background: #007bff; color: white; }
        .highlight-box { background: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px dashed #ced4da; }
    </style>
</head>
<body>

<div class="container">
    <h2>Nhật Ký Bảo Dưỡng</h2>
    <form id="maintenanceForm">
        
        <div class="form-group">
            <label>Loại động cơ:</label>
            <div class="radio-group">
                <label><input type="radio" name="dongCo" value="Xe Xăng" checked onchange="updateTags()"> Xe Xăng</label>
                <label><input type="radio" name="dongCo" value="Xe Điện" onchange="updateTags()"> Xe Điện (Pin LFP)</label>
            </div>
        </div>

        <div class="form-group">
            <label>Loại xe:</label>
            <select id="loaiXe" required>
                <option value="Xe máy">Xe máy</option>
                <option value="Ô tô">Ô tô</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Biển số xe (Chính xác):</label>
            <input type="text" id="bienSo" placeholder="VD: 60A-123.45" required style="text-transform: uppercase;">
        </div>

        <!-- MỚI THÊM: Ngày thực hiện -->
        <div class="form-group">
            <label>Ngày thực hiện:</label>
            <input type="date" id="ngayThucHien" required>
        </div>

        <div class="form-group">
            <label>Số Km ODO trên đồng hồ:</label>
            <input type="number" id="soKm" placeholder="VD: 15500" required>
        </div>

        <div class="form-group">
            <label>Hạng mục thực hiện:</label>
            <input type="text" id="hangMuc" placeholder="Gõ hoặc chọn gợi ý bên dưới..." required>
            <div class="suggestions" id="tagContainer"></div>
        </div>

        <div class="form-group highlight-box">
            <label style="color: #d9534f;">Thiết lập nhắc nhở tự động:</label>
            <div class="radio-group">
                <label><input type="radio" name="tanSuat" value="Ít" checked onchange="toggleKmInput()"> Xe đi ít (Nhắc sau 6 tháng)</label>
                <label><input type="radio" name="tanSuat" value="Nhiều" onchange="toggleKmInput()"> Xe đi nhiều (Nhắc theo ODO)</label>
            </div>
            
            <div id="kmTrungBinhDiv" style="display: none; margin-top: 15px;">
                <label>Số Km đi trung bình 1 ngày (Ước tính):</label>
                <input type="number" id="kmTrungBinh" placeholder="VD: 30 (Mỗi ngày đi làm 30km)">
            </div>
        </div>

        <div class="form-group">
            <label>Tổng chi phí (VNĐ):</label>
            <input type="number" id="chiPhi" placeholder="VD: 150000" required>
        </div>

        <div class="form-group">
            <label>Ghi chú thêm:</label>
            <textarea id="ghiChu" rows="2" placeholder="Ghi chú về thợ, xưởng hoặc phụ tùng..."></textarea>
        </div>

        <button type="submit" id="submitBtn">Lưu Báo Cáo</button>
        <div id="status"></div>
    </form>
</div>

<script>
    // === ĐIỀN URL WEB APP CỦA BẠN VÀO ĐÂY ===
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLd_3MpTHmZjqPdcLADnI53OOAaIezAKSXom8G7Ffonjc2oaRWcQFVVWEcykljoepaHw/exec';
    // =======================================

    // Tự động set Ngày thực hiện là hôm nay
    document.getElementById('ngayThucHien').valueAsDate = new Date();

    const hangMucInput = document.getElementById('hangMuc');
    const tagContainer = document.getElementById('tagContainer');

    const tagsXang = ["Thay nhớt máy", "Thay nhớt láp", "Vệ sinh nồi", "Thay lọc gió", "Bơm lốp", "Thay phanh"];
    const tagsDien = ["Thay dầu láp (hộp số)", "Kiểm tra pin LFP", "Bơm lốp", "Thay phanh", "Kiểm tra phuộc"];

    function updateTags() {
        tagContainer.innerHTML = ''; 
        const isDien = document.querySelector('input[name="dongCo"][value="Xe Điện"]').checked;
        const currentTags = isDien ? tagsDien : tagsXang;

        currentTags.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.innerText = tag;
            span.onclick = () => {
                if(hangMucInput.value && hangMucInput.value.length > 2) {
                     hangMucInput.value = hangMucInput.value + ", " + tag;
                } else {
                     hangMucInput.value = tag;
                }
            };
            tagContainer.appendChild(span);
        });
    }

    function toggleKmInput() {
        const val = document.querySelector('input[name="tanSuat"]:checked').value;
        const div = document.getElementById('kmTrungBinhDiv');
        div.style.display = (val === 'Nhiều') ? 'block' : 'none';
        if (val === 'Ít') document.getElementById('kmTrungBinh').value = '';
    }

    updateTags();

    document.getElementById('maintenanceForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        
        const dongCo = document.querySelector('input[name="dongCo"]:checked').value;
        const loaiXeHienTai = document.getElementById('loaiXe').value;
        
        // Lấy ngày, chuyển format yyyy-mm-dd sang dd/MM/yyyy để App Script dễ nhận
        const ngayGoc = document.getElementById('ngayThucHien').value;
        const ngayArray = ngayGoc.split('-'); // ["2026", "08", "22"]
        const ngayFormat = ngayArray[2] + "/" + ngayArray[1] + "/" + ngayArray[0];

        const data = {
            ngayThucHien: ngayFormat, // Truyền ngày format dd/MM/yyyy sang Script
            loaiXe: loaiXeHienTai + " (" + dongCo + ")", 
            bienSo: document.getElementById('bienSo').value.trim().toUpperCase(),
            soKm: document.getElementById('soKm').value,
            hangMuc: document.getElementById('hangMuc').value,
            chiPhi: document.getElementById('chiPhi').value,
            ghiChu: document.getElementById('ghiChu').value,
            tanSuat: document.querySelector('input[name="tanSuat"]:checked').value,
            kmTrungBinh: document.getElementById('kmTrungBinh').value || 0
        };

        btn.disabled = true;
        btn.innerText = 'Đang đồng bộ...';
        statusDiv.className = 'loading';
        statusDiv.innerText = 'Đang gửi dữ liệu...';
        statusDiv.style.display = 'block';

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(data)
        })
        .then(() => {
            statusDiv.className = 'success';
            statusDiv.innerText = '✅ Đã gửi lệnh lưu!';
            document.getElementById('hangMuc').value = '';
            document.getElementById('chiPhi').value = '';
            document.getElementById('ghiChu').value = '';
        })
        .catch(error => {
            statusDiv.className = 'error';
            statusDiv.innerText = '❌ Lỗi mạng: ' + error.message;
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = 'Lưu Báo Cáo';
            setTimeout(() => { statusDiv.style.display = 'none'; }, 5000);
        });
    });
</script>

</body>
</html>
